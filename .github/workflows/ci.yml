name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.9" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntaxe Python
        run: python -m py_compile mosaik.py tests/test_recuperation.py
      - name: Lint
        run: pip install pyflakes && python -m pyflakes mosaik.py
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh uninstall.sh scripts/install-linux.sh
      - name: Test de récupération (fichiers fragmentés)
        run: pip install pillow && python tests/test_recuperation.py
